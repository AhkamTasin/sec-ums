{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block page_heading %}{{ title }}{% endblock %}
{% block content %}
<div class="row"><div class="col-lg-7">
<div class="card"><div class="card-body p-4">
    <form method="post" novalidate>
        {% csrf_token %}
        {% for field in form %}
        <div class="mb-3">
            <label class="form-label fw-semibold">{{ field.label }}</label>
            {{ field }}
            {% for e in field.errors %}<div class="text-danger small mt-1">{{ e }}</div>{% endfor %}
        </div>
        {% endfor %}
        <div class="d-flex gap-2">
            <button class="btn btn-primary"><i class="fa-solid fa-bullhorn me-1"></i>Save Notice</button>
            <a class="btn btn-outline-secondary" href="{% url 'accounts:manage_notices' %}">Cancel</a>
        </div>
    </form>
</div></div>
</div></div>
{% endblock %}
