{% load static %}
{# Shared SEC-branded header for printable documents. Usage: include with doc_title="X" #}
<div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
    <div class="doc-head">
        <img src="{% static 'img/logo.png' %}" alt="Sylhet Engineering College logo">
        <div>
            <div class="dh-name">Sylhet Engineering College</div>
            <div class="dh-sub">University Management System</div>
        </div>
    </div>
    {% if doc_title %}
    <div class="text-end">
        <span class="dh-doc-title">{{ doc_title }}</span>
    </div>
    {% endif %}
</div>
<div class="doc-rule"></div>
