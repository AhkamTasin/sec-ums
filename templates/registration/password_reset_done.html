{% extends "auth_base.html" %}
{% block title %}Check Your Email{% endblock %}
{% block content %}
<div class="text-center">
    <i class="fa-solid fa-envelope-circle-check display-1 text-success"></i>
    <h5 class="fw-bold mt-3">Reset link sent</h5>
    <p class="text-muted small">If an account with that email exists, a password reset link has been sent. Follow the link to choose a new password.</p>
    <a class="btn btn-primary" href="{% url 'accounts:login' %}">Back to login</a>
</div>
{% endblock %}
