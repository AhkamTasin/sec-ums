{% extends "auth_base.html" %}
{% block title %}Password Changed{% endblock %}
{% block content %}
<div class="text-center">
    <i class="fa-solid fa-circle-check display-1 text-success"></i>
    <h5 class="fw-bold mt-3">Password reset complete</h5>
    <p class="text-muted small">Your password has been changed. You can now log in with the new password.</p>
    <a class="btn btn-primary" href="{% url 'accounts:login' %}">Go to login</a>
</div>
{% endblock %}
