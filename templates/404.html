{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page Not Found — SEC UMS</title>
    <link rel="icon" type="image/png" href="{% static 'img/favicon.png' %}">
    <link rel="stylesheet" href="{% static 'vendor/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'vendor/fontawesome/css/all.min.css' %}">
    <link rel="stylesheet" href="{% static 'vendor/gfonts/fonts.css' %}">
    <link rel="stylesheet" href="{% static 'css/custom.css' %}">
</head>
<body style="min-height:100vh; display:flex; align-items:center; background: radial-gradient(900px 500px at 85% -10%, rgba(196,77,104,.16), transparent 60%), var(--bg);">
<div class="container text-center py-5" style="max-width: 560px;">
    <img src="{% static 'img/logo.png' %}" alt="SEC logo" style="width: 92px; height: 92px;" class="bg-white rounded-circle p-1 shadow mb-4">
    <div style="font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:5rem; line-height:1; color: var(--brand-600);">404</div>
    <h3 class="fw-bold mt-2" style="font-family:'Plus Jakarta Sans',sans-serif;">Page not found</h3>
    <p class="text-muted">The page you are looking for doesn't exist or was moved.<br>Let's get you back on track.</p>
    <div class="d-flex gap-2 justify-content-center mt-3">
        <a href="{% url 'accounts:landing' %}" class="btn btn-outline-secondary"><i class="fa-solid fa-house me-1"></i>Home</a>
        <a href="{% url 'accounts:dashboard' %}" class="btn btn-primary"><i class="fa-solid fa-gauge-high me-1"></i>My Dashboard</a>
    </div>
    <p class="small mt-5" style="color: var(--muted);">© {% now "Y" %} Sylhet Engineering College — University Management System</p>
</div>
</body>
</html>
